services:
  postgres:
    image: postgres:18-alpine
    container_name: csp-sri-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cspsri
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
