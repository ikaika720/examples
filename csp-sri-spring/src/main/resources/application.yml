server:
  port: 8443
  http2:
    enabled: true
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: ${KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: LAX
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,image/svg+xml,application/json
    min-response-size: 512

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cspsri
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always

logging:
  level:
    root: INFO
    com.example.cspsri: DEBUG
